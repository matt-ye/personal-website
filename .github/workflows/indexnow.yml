# IndexNow 自動提交：push 到 main 後，把 sitemap 裡的全部網址提交給
# api.indexnow.org。Bing／Yandex／Naver／Seznam 即時收到；ChatGPT Search
# 靠 Bing 索引，所以這條對「被 AI 引用」有實際價值。Google 不支援
# IndexNow，走原本的 sitemap 自然抓取，本 workflow 不處理。
#
# ponytail: 提交的是整份 sitemap（~90 條），不是 diff 出來的變更頁。
# 這個量級對 IndexNow 完全無害（濫用門檻是百萬級），換來零映射邏輯
# ——不用維護「哪個 source 檔對應哪個網址」的規則表。
# 若未來頁數成長到數千，再改成 diff 制。
#
# 2026-08-24：原本對 https://mattye.dev/sitemap-0.xml 發 HTTP 抓取，
# 但 Cloudflare 把 GitHub Actions 的出口 IP 當機器人擋下（HTTP 403 +
# 「Just a moment...」挑戰頁），連續 8 次重試、間隔 30 秒全部一樣，
# 不是部署延遲、重試也無效（run 32701360538）。改成 checkout + 本機
# build，直接讀 dist/ 產物，完全不對外抓 mattye.dev，繞開這層邊緣防護。
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

      - name: Submit sitemap URLs to IndexNow
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";

            const HOST = "mattye.dev";
            const KEY = "fa0eee755c45a6e7828a93590876a465";

            const xml = readFileSync("dist/sitemap-0.xml", "utf-8");
            const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            if (urls.length === 0) throw new Error("build 出來的 sitemap 是空的 — abort");

            const localKey = readFileSync(`dist/${KEY}.txt`, "utf-8").trim();
            if (localKey !== KEY) throw new Error(`key 檔內容對不上：${JSON.stringify(localKey)}`);

            const res = await fetch("https://api.indexnow.org/indexnow", {
              method: "POST",
              headers: { "Content-Type": "application/json; charset=utf-8" },
              body: JSON.stringify({
                host: HOST,
                key: KEY,
                keyLocation: `https://${HOST}/${KEY}.txt`,
                urlList: urls,
              }),
            });
            console.log(`submitted ${urls.length} URLs — HTTP ${res.status}`);
            // 200 = 收到；202 = 收到、key 驗證排程中。其他都算失敗
            if (res.status !== 200 && res.status !== 202) process.exit(1);
          '
