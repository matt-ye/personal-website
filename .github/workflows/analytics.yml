# 每日 analytics 快照：GA4 + Cloudflare + GitHub → secret gist
# 手動觸發：Actions → analytics → Run workflow
# 設定步驟見 docs/analytics-pipeline.md
name: analytics

on:
  schedule:
    # 每 6 小時：09:30 / 15:30 / 21:30 / 03:30 台北（public repo 的 Actions 免費不限量）
    - cron: '30 1,7,13,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # v5 系列跑在 Node 24 runner 上，消除 Node 20 deprecation 警告
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch analytics and publish to gist
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          GH_TRAFFIC_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          # 這一步只需要 D1 讀寫，但 CF_DEPLOY_TOKEN 同時帶著 Workers Scripts:Edit 與
          # Workers Routes:Edit@mattye.dev——一把能部署 Worker 的 token，每天被注入四次
          # 只為了跑一句 D1 query。改用專門的 CF_D1_TOKEN（Cloudflare 主控台的 data-stores，
          # 權限只有 D1／KV／R2），部署 token 就只在真的要部署時才出現。
          # `||` 是為了讓這個改動不需要跟 secret 設定同時發生：CF_D1_TOKEN 沒設時
          # 自動沿用舊的那把，設好之後下一次執行就自動切過去。切換完成後可以拿掉後半。
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN || secrets.CF_DEPLOY_TOKEN }}
        run: node scripts/fetch-analytics.mjs
      - name: Upload snapshot artifact (debug)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: analytics-snapshot
          path: out/
          retention-days: 7
          if-no-files-found: ignore
